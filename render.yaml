services:
  - type: web
    name: xmpp-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn simple_bot.render_service:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: XMPP_JID
        sync: false
      - key: XMPP_PASSWORD
        sync: false
      - key: XMPP_NICKNAME
        sync: false
      - key: XMPP_ROOMS
        sync: false
      - key: XMPP_ENV_FILE
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      - key: KEEPALIVE_INTERVAL
        value: "600"
      - key: BOT_RESTART_DELAY
        value: "15"
